<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mycorr Invite</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --text:#e8eaf0; --muted:#9aa3b2; --accent:#7c9cff; --ok:#4cd98a; --warn:#f5b454; }
  * { box-sizing:border-box } body { margin:0; font:16px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--text) }
  main { max-width:560px; margin:0 auto; padding:24px 16px }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px }
  h1 { font-size:22px; margin:0 0 6px } h2 { font-size:16px; margin:0 0 10px } .muted { color:var(--muted); font-size:13px }
  input { width:100%; background:#0f1218; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit }
  button { background:var(--accent); color:#0b0d12; border:0; border-radius:8px; padding:10px 14px; font-weight:600; cursor:pointer; margin-top:10px }
  .chat { min-height:220px; max-height:380px; overflow:auto; border:1px solid var(--line); border-radius:8px; padding:10px; background:#0f1218 }
  .msg { margin:8px 0; padding:8px 10px; border-radius:10px; max-width:88%; width:fit-content } .user { background:#243055; margin-left:auto } .assistant { background:#1f2a22 }
  .row { display:flex; gap:8px; margin-top:10px } .row input { flex:1 } .row button { margin:0 }
  .ready { color:var(--ok) } .pending { color:var(--warn) } .hidden { display:none } a { color:var(--accent) }
</style>
</head>
<body>
<main>
  <section class="panel" id="inviteCard">
    <h1 id="title">Loading invitation…</h1>
    <div class="muted" id="details"></div>
    <div id="acceptForm" class="hidden">
      <p>You're invited. Tell me your name and we'll do a quick 30-second chat so your agent can plan for you.</p>
      <input id="name" placeholder="your name (letters and numbers)" />
      <button id="accept">Accept & start</button>
      <div class="muted" id="err"></div>
    </div>
  </section>

  <section class="panel hidden" id="chatCard">
    <h2>Quick chat with your agent</h2>
    <div class="chat" id="chat"></div>
    <div class="row"><input id="text" placeholder="type like you would to a friend…" /><button id="send">Send</button></div>
    <div class="muted" id="status"></div>
  </section>

  <section class="panel hidden" id="groupCard">
    <h2>The group</h2>
    <div id="readiness" class="muted"></div>
    <div id="runLine" class="muted"></div>
    <p class="muted">Once everyone has chatted, the agents plan together automatically. <a id="runLink" href="#" target="_blank">See the run and the draft itinerary ↗</a></p>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const [tripIdFromUrl, token] = location.pathname.split('/').slice(-2);
const store = (k, v) => { try { v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch {} ; try { return localStorage.getItem(k); } catch { return null; } };
let me = store('mycorr:user') || '';
let tripId = '';
const api = async (path, opts = {}) => {
  const r = await fetch('/api' + path, { ...opts, headers: { 'Content-Type': 'application/json', ...(me ? { 'x-mycorr-user': me } : {}), ...(opts.headers || {}) } });
  const body = r.headers.get('content-type')?.includes('json') ? await r.json() : await r.text();
  if (!r.ok) throw new Error(body?.error?.message || r.statusText);
  return body;
};
const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function load() {
  try {
    const inv = await api(`/invites/${tripIdFromUrl}/${token}`);
    tripId = inv.trip.tripId;
    $('title').textContent = `${inv.trip.creatorId} invited you to "${inv.trip.title}"`;
    $('details').textContent = `${inv.trip.city} · ${inv.trip.dateRange.start} to ${inv.trip.dateRange.end} · ${inv.trip.participantIds.length} going so far`;
    if (me && inv.trip.participantIds.includes(me)) { showChat(); } else { $('acceptForm').classList.remove('hidden'); if (me) $('name').value = me; }
  } catch (e) { $('title').textContent = 'This invitation is not valid.'; $('details').textContent = e.message; }
}
$('accept').onclick = async () => {
  const name = $('name').value.trim().toLowerCase().replace(/[^a-z0-9._-]+/g, '-').replace(/^-|-$/g, '');
  if (!name) { $('err').textContent = 'please enter a name'; return; }
  me = name; store('mycorr:user', me);
  try { await api(`/invites/${tripIdFromUrl}/${token}/accept`, { method: 'POST' }); showChat(); } catch (e) { $('err').textContent = e.message; }
};
function showChat() { $('acceptForm').classList.add('hidden'); $('chatCard').classList.remove('hidden'); $('groupCard').classList.remove('hidden'); poll(); }
async function poll() {
  if (!tripId || !me) return;
  try {
    const ob = await api(`/trips/${tripId}/onboarding`);
    const opener = ob.messages.length ? '' : `<div class="msg assistant">quick one, are you into restaurants when you travel?</div>`;
    $('chat').innerHTML = opener + ob.messages.map(m => `<div class="msg ${m.role}">${escapeHtml(m.text)}</div>`).join('');
    $('chat').scrollTop = $('chat').scrollHeight;
    $('status').innerHTML = ob.session.status === 'ready' ? `<span class="ready">done, your agent has what it needs</span>` : (ob.pendingTask ? 'typing…' : '');
    const v = await api(`/trips/${tripId}`);
    $('readiness').innerHTML = v.readiness.map(p => `<span class="${p.ready ? 'ready' : 'pending'}">${p.userId}${p.ready ? ' ✓' : ' …'}</span>`).join('  ');
    const runId = v.activeRunId || v.runIds[v.runIds.length - 1];
    if (runId) {
      const rv = await api(`/trips/${tripId}/runs/${runId}`);
      $('runLine').textContent = `planning run: ${rv.run.status}${rv.run.result ? ' · ' + rv.run.result.summary : ''}`;
      $('runLink').onclick = async (ev) => { ev.preventDefault(); const r = await fetch(`/api/trips/${tripId}/runs/${runId}/transcript?format=txt`, { headers: { 'x-mycorr-user': me } }); const w = window.open('', '_blank'); w.document.write('<pre style="white-space:pre-wrap;font:13px monospace">' + escapeHtml(await r.text()) + '</pre>'); };
    } else $('runLine').textContent = 'planning run: waiting for everyone';
  } catch (e) { $('status').textContent = 'error: ' + e.message; }
}
$('send').onclick = async () => {
  const text = $('text').value.trim(); if (!text) return; $('text').value = '';
  try { await api(`/trips/${tripId}/onboarding/messages`, { method: 'POST', body: JSON.stringify({ clientMessageId: crypto.randomUUID(), text }) }); } catch (e) { $('status').textContent = 'error: ' + e.message; }
  setTimeout(poll, 600);
};
$('text').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('send').click(); });
setInterval(poll, 2500);
load();
</script>
</body>
</html>
